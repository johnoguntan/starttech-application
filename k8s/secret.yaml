# DO NOT commit real values — use CI/CD to inject secrets via:
#   kubectl create secret generic backend-secrets \
#     --from-literal=MONGO_URI="mongodb+srv://..." \
#     --from-literal=JWT_SECRET_KEY="..." \
#     --from-literal=REDIS_PASSWORD="" \
#     --namespace=default
apiVersion: v1
kind: Secret
metadata:
  name: backend-secrets
  namespace: default
type: Opaque
stringData:
  MONGO_URI: "REPLACE_WITH_MONGO_ATLAS_URI"
  JWT_SECRET_KEY: "REPLACE_WITH_STRONG_SECRET"
  REDIS_PASSWORD: ""
