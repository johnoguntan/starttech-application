apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: default
  labels:
    app: backend-api
  # No AWS Load Balancer Controller annotations here on purpose — this
  # is a plain NodePort Service. The ALB that fronts it is created
  # directly by Terraform (starttech-infra/terraform/modules/eks/main.tf:
  # aws_lb + aws_lb_target_group + aws_autoscaling_attachment targeting
  # the EKS managed node group's own ASG on this NodePort), not by any
  # in-cluster controller reconciling this object.
spec:
  type: NodePort
  selector:
    app: backend-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
      nodePort: 30080
