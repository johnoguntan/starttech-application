name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'k8s/**'

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1

jobs:
  backend:
    name: Test, build, scan, push, deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: backend/go.sum

      - name: Go mod tidy (self-heals go.sum if it's out of date)
        working-directory: backend
        run: go mod tidy

      - name: Run tests
        working-directory: backend
        run: go test ./...

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/starttech-app-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        working-directory: backend
        run: |
          IMAGE_URI="${{ steps.ecr-login.outputs.registry }}/starttech-backend-api:${{ steps.vars.outputs.sha }}"
          docker build -t "${IMAGE_URI}" .
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # report, don't hard-block the pipeline on findings — review manually

      - name: Push image to ECR
        run: |
          docker push "${IMAGE_URI}"
          docker tag "${IMAGE_URI}" "${{ steps.ecr-login.outputs.registry }}/starttech-backend-api:latest"
          docker push "${{ steps.ecr-login.outputs.registry }}/starttech-backend-api:latest"

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "${{ env.AWS_REGION }}" --name starttech-cluster

      - name: Update deployment manifest with new image tag
        run: |
          sed -i "s|image: .*starttech-backend-api:.*|image: ${IMAGE_URI}|" k8s/deployment.yaml

      - name: Apply Kubernetes manifests
        run: kubectl apply -f k8s/configmap.yaml -f k8s/service.yaml -f k8s/deployment.yaml
        # secret.yaml is intentionally excluded — real secrets are created
        # out-of-band (kubectl create secret) and never committed;
        # applying the placeholder file here would overwrite them.

      - name: Verify rollout
        run: kubectl rollout status deployment/backend-api --namespace=default --timeout=5m
